<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Margin Collapsing - Class 5</title>

    <style>
      .box {
        width: 100px;
        height: 100px;
      }

      .satu {
        background-color: salmon;
        margin-top: 50px;
        border: 1px solid red;
      }

      .dua {
        background-color: aqua;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <h1>MATERI MARGIN COLLAPSING</h1>
    <div class="box satu"></div>
    <div class="box dua"></div>
  </body>
</html>
