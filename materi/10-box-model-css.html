<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model - Class 5</title>
    <style>
      .content-box {
        width: 200px;
        height: 200px;
        background-color: lightblue;
        line-height: 200px;
        text-align: center;

        /* PADDING */
        padding: 50px;

        /* BORDER */
        /* border : ukuran gaya warna */
        border: 5px solid red;

        /* MARGIN */
        margin: 200px;
      }
    </style>
  </head>
  <body>
    <div class="content-box">Konten Di sini</div>
  </body>
</html>
