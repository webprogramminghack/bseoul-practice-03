<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Sizing - Class 5</title>
    <style>
      /* box-content = 250px */
      .box-content {
        width: 200px;
        padding: 20px;
        border: 5px solid #000;
        box-sizing: content-box;
      }

      /* box-border = 200px */
      .box-border {
        width: 200px;
        padding: 20px;
        border: 5px solid #000;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>MATERI BOX SIZING CSS</h1>
    <div class="box-content">Content Box</div>
    <div class="box-border">Border Box</div>
  </body>
</html>
