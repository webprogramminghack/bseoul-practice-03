<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Background - Class 5</title>
    <style>
      div {
        background-image: url("https://www.greenscene.co.id/wp-content/uploads/2020/03/Avengers.jpg");
        height: 100dvh;

        background-repeat: no-repeat;

  </head>
  <body>

      <h1 style="color: white; background-color: aqua">Hello world</h1>
